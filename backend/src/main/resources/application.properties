# Application Configuration
spring.application.name=secure-banking-system
server.port=8080

# Active profile: defaults to h2 for zero-config local run, switch to mysql via SPRING_PROFILES_ACTIVE=mysql
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# MySQL Database Configuration (activated when SPRING_PROFILES_ACTIVE=mysql)
# Connects to MySQL 8.0 on port 3306. Automatically creates `banking_db` if it does not exist.
# Can be overridden via system env: DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:banking_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate ORM & JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration (256-bit base64 secret)
banking.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
banking.app.jwtExpirationMs=86400000

# CORS Allowed Origins for React Frontend
banking.app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# Logging
logging.level.com.bank.securebanking=INFO
logging.level.org.springframework.security=INFO
